name: Build and Publish

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            pkg: memspace-linux-x64
          - os: ubuntu-latest
            arch: arm64
            pkg: memspace-linux-arm64
          - os: macos-latest
            arch: x64
            pkg: memspace-darwin-x64
          - os: macos-latest
            arch: arm64
            pkg: memspace-darwin-arm64
          - os: windows-latest
            arch: x64
            pkg: memspace-win32-x64
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'
        run: sudo apt-get update && sudo apt-get install -y build-essential
        
      - name: Install dependencies (Ubuntu arm64)
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y build-essential gcc-aarch64-linux-gnu
        
      - name: Build (Ubuntu arm64 cross-compile)
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'arm64'
        run: make CC=aarch64-linux-gnu-gcc
        
      - name: Build (Other Unix)
        if: matrix.os != 'windows-latest' && !(matrix.os == 'ubuntu-latest' && matrix.arch == 'arm64')
        run: make
        
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: make
        shell: bash
        
      - name: Copy binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p npm/packages/${{ matrix.pkg }}/bin
          cp bin/memspace npm/packages/${{ matrix.pkg }}/bin/memspace
          
      - name: Copy binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p npm/packages/${{ matrix.pkg }}/bin
          cp bin/memspace.exe npm/packages/${{ matrix.pkg }}/bin/memspace.exe
        shell: bash
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: npm/packages/${{ matrix.pkg }}/bin/

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Prepare packages
        run: |
          for pkg in memspace-linux-x64 memspace-linux-arm64 memspace-darwin-x64 memspace-darwin-arm64; do
            mkdir -p npm/packages/$pkg/bin
            cp artifacts/$pkg/memspace npm/packages/$pkg/bin/memspace
            chmod 755 npm/packages/$pkg/bin/memspace
          done
          
          mkdir -p npm/packages/memspace-win32-x64/bin
          cp artifacts/memspace-win32-x64/memspace.exe npm/packages/memspace-win32-x64/bin/memspace.exe
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Publish optional dependencies
        run: |
          for pkg in memspace-linux-x64 memspace-linux-arm64 memspace-darwin-x64 memspace-darwin-arm64 memspace-win32-x64; do
            cd npm/packages/$pkg
            npm publish --access public
            cd ../../..
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          
      - name: Publish root package
        run: |
          cd npm
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

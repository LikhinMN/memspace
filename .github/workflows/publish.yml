name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Prepare packages
        run: |
          for pkg in memspace-linux-x64 memspace-linux-arm64 memspace-darwin-x64 memspace-darwin-arm64; do
            mkdir -p npm/packages/$pkg/bin
            cp artifacts/$pkg/memspace npm/packages/$pkg/bin/memspace
            chmod 755 npm/packages/$pkg/bin/memspace
          done
          
          mkdir -p npm/packages/memspace-win32-x64/bin
          cp artifacts/memspace-win32-x64/memspace.exe npm/packages/memspace-win32-x64/bin/memspace.exe
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Publish optional dependencies
        run: |
          for pkg in memspace-linux-x64 memspace-linux-arm64 memspace-darwin-x64 memspace-darwin-arm64 memspace-win32-x64; do
            cd npm/packages/$pkg
            npm publish --access public
            cd ../../..
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          
      - name: Publish root package
        run: |
          cd npm
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
